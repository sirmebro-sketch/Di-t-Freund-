plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'de.diaetfreund.app'
    compileSdk 36
    defaultConfig {
        applicationId 'de.diaetfreund.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.8.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev' }
        // Release is intentionally unsigned here. The protected signing step runs after all checks.
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

// Pinned, verified build-time download. The installed OCR works without internet or telemetry.
def ocrAssets = layout.buildDirectory.dir('generated/ocrAssets')
android.sourceSets.main.assets.srcDir(ocrAssets)
tasks.register('prepareOcrModel') {
    outputs.file(ocrAssets.map { it.file('ocr/deu.traineddata') })
    doLast {
        def target = ocrAssets.get().file('ocr/deu.traineddata').asFile
        def expected = '19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d'
        def digest = { bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        if (!target.exists() || digest(target.bytes) != expected) {
            def connection = new URL('https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/deu.traineddata').openConnection()
            connection.connectTimeout = 30000; connection.readTimeout = 60000
            def bytes = connection.inputStream.withCloseable { it.bytes }
            if (digest(bytes) != expected) throw new GradleException('OCR model checksum mismatch')
            target.parentFile.mkdirs(); target.bytes = bytes
        }
    }
}
tasks.named('preBuild').configure { dependsOn('prepareOcrModel') }
